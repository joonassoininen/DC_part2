services:
  frontend:
    build:
      context: ../example-app/frontend
      args:
        REACT_APP_BACKEND_URL: http://localhost:8080
    ports:
      - 5001:5001
  backend:
    build:
      context: ../example-app/backend
    ports:
      - 8080:8080
    environment:
      - REQUEST_ORIGIN=http://localhost:5001

