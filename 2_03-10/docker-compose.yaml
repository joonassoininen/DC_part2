services:
  frontend:
    image: joonassoininen/example-frontend
    ports:
      - 5001:5001
  backend:
    image: joonassoininen/example-backend
    ports:
      - 8080:8080
    environment:
      - REQUEST_ORIGIN=http://localhost:5001
      - REDIS_HOST=redis
    restart: unless-stopped
  redis:
    image: redis

